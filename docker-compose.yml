# ===== Lab 7: multi-container calculator with Docker Compose =====
# Two services:
#   backend : Java calculator HTTP API, listens on 8000
#   web     : nginx static frontend, listens on 80, proxies /api/ to backend

services:
  # ---- Service 1: backend (calculator API) ----
  backend:
    # build: use the Dockerfile in the local ./backend directory
    # (we build from source, we do NOT pull a pre-built image)
    build: ./backend
    # port mapping: host 8000 -> container 8000
    ports:
      - "8000:8000"
    # restart policy: only restart if the process exits with a non-zero code
    restart: on-failure
    # optional exercise: inject an environment variable (e.g. log level)
    environment:
      LOG_LEVEL: INFO

  # ---- Service 2: web (frontend) ----
  web:
    # build: use the Dockerfile in the local ./web directory
    build: ./web
    # port mapping: host 8080 -> container 80
    # the user opens http://127.0.0.1:8080 in the browser
    ports:
      - "8080:80"
    # depends_on: start backend first, so nginx can resolve the "backend"
    # service name in the compose network. Note: it guarantees START ORDER,
    # not that the backend is already ready to accept requests.
    depends_on:
      - backend
    restart: on-failure
