# nginx configuration for the web container (Lab 7)
# The container listens on port 80 and does two jobs:
#   1. serve the static calculator page (index.html)
#   2. reverse-proxy /api/* requests to the backend service inside the
#      docker compose network, using the SERVICE NAME "backend" as hostname.

server {
    listen 80;
    server_name localhost;

    # Serve the static frontend page
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Reverse proxy: /api/calculate?a=..&op=..&b=..  ->  http://backend:8000/calculate?a=..&op=..&b=..
    # The trailing slash on proxy_pass replaces the /api/ prefix, so the
    # backend receives its own /calculate path unchanged.
    location /api/ {
        proxy_pass http://backend:8000/;
    }
}
