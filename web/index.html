<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator - Lab 7</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      padding: 28px 32px;
      width: 380px;
      text-align: center;
    }
    h1 {
      font-size: 20px;
      color: #1b4f8a;
      margin-top: 0;
    }
    .row {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin: 16px 0;
    }
    input, select {
      font-size: 16px;
      padding: 8px 10px;
      border: 1px solid #c8d3e0;
      border-radius: 6px;
      width: 90px;
      text-align: center;
    }
    select { width: 60px; }
    button {
      font-size: 16px;
      padding: 10px 28px;
      background: #1b4f8a;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #14406e; }
    .result {
      margin-top: 18px;
      font-size: 26px;
      font-weight: 700;
      color: #333;
      min-height: 36px;
      word-break: break-all;
    }
    .error {
      color: #c0392b;
      font-size: 15px;
      margin-top: 6px;
    }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calculator API Demo</h1>

    <div class="row">
      <input type="text" id="a" placeholder="a" value="4">
      <select id="op">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
      <input type="text" id="b" placeholder="b" value="2">
    </div>

    <button onclick="calculate()">Calculate</button>

    <div class="result" id="result">= ?</div>
    <div class="error" id="error"></div>
    <div class="hint">Frontend web container → nginx → backend:8000</div>
  </div>

  <script>
    async function calculate() {
      const a = document.getElementById('a').value;
      const op = document.getElementById('op').value;
      const b = document.getElementById('b').value;
      const errorDiv = document.getElementById('error');
      const resultDiv = document.getElementById('result');
      errorDiv.textContent = '';
      resultDiv.textContent = '...';

      // Build the URL with a relative /api path: the request only goes to nginx,
      // and nginx proxies it to http://backend:8000 inside the compose network.
      const url = '/api/calculate?a=' + encodeURIComponent(a)
                + '&op=' + encodeURIComponent(op)
                + '&b=' + encodeURIComponent(b);

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (res.ok) {
          resultDiv.textContent = a + ' ' + op + ' ' + b + ' = ' + data.result;
        } else {
          resultDiv.textContent = '= ?';
          errorDiv.textContent = 'Error: ' + data.error;
        }
      } catch (err) {
        resultDiv.textContent = '= ?';
        errorDiv.textContent = 'Network error: ' + err;
      }
    }
  </script>
</body>
</html>
