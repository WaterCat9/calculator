name: Java CI

# Trigger rules: run on push to main, and on pull requests targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: compile and run all JUnit tests (kept from Lab5).
  # Since Lab7 moved the Maven project into backend/, every mvn command now
  # runs inside the backend/ directory (working-directory).
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven
      - run: mvn -B clean compile
      - run: mvn -B test

  # Job 2 (Lab7): validate docker-compose.yml and build BOTH images.
  # docker compose build parses the compose file and runs the two local
  # Dockerfiles (./backend and ./web). If the YAML or either Dockerfile is
  # wrong, this job turns red before bad config ever reaches main.
  # (The old Lab6 single-image "docker build ." job is gone: the root no
  # longer has a Dockerfile, and compose build covers both services.)
  compose-build:
    runs-on: ubuntu-latest
    needs: build          # only starts after job "build" succeeds
    steps:
      - uses: actions/checkout@v4   # fetch the full repository (compose file + both service dirs)
      - name: Validate compose config and build images
        run: docker compose build
